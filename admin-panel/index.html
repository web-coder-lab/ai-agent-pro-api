<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>AAP Central Admin</title>
<style>
:root{
  --bg:#07070a;--card:#12121a;--line:#27272f;--txt:#f4f4f5;--mut:#a1a1aa;
  --acc:#a78bfa;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.box h1{margin:0 0 4px;font-size:1.25rem}
.box .sub{color:var(--mut);font-size:.85rem;margin-bottom:18px}
label{display:block;font-size:.72rem;color:var(--mut);margin:12px 0 6px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0a0a10;color:var(--txt);font-size:15px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff}
button.ghost{background:#1f1f28;color:var(--txt)}
button.danger{background:#450a0a;color:#fecaca}
button.sm{padding:7px 10px;font-size:.75rem}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}
#app{display:none;min-height:100vh}
#app.open{display:flex;flex-direction:column}
.top{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#0c0c12;flex-wrap:wrap}
.top .brand{font-weight:700;font-size:.9rem;color:var(--acc)}
.top select{width:auto;min-width:160px;flex:1;max-width:280px;padding:8px 10px;font-size:13px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.nav button{flex:0 0 auto;background:#1a1a22;font-size:.8rem;padding:8px 12px}
.nav button.active{background:#3b0764;color:#e9d5ff}
main{padding:14px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{background:#0a0a10;border-radius:12px;padding:12px}
.stat .n{font-size:1.35rem;font-weight:700}
.stat .l{font-size:.7rem;color:var(--mut);margin-top:2px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;background:#27272a}
.pill.ok{background:#052e16;color:var(--ok)}
.pill.bad{background:#450a0a;color:var(--bad)}
.muted{color:var(--mut);font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.servers-edit input{flex:1;min-width:180px}
@media(min-width:800px){
  #app.open{flex-direction:row}
  .side{width:200px;border-right:1px solid var(--line);border-bottom:0;flex-direction:column;padding:12px}
  .side button{width:100%}
  .maincol{flex:1;display:flex;flex-direction:column;min-width:0}
  .nav{flex-direction:column;border-bottom:0}
}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Central Admin</h1>
    <div class="sub">Saari API servers ek panel se · multi-backend</div>
    <label>Server (pehle list mein add karo)</label>
    <select id="loginServer"></select>
    <label>Admin email</label>
    <input id="email" type="email" value="husdainshah2@gmail.com" autocomplete="username"/>
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password"/>
    <div class="row" style="margin-top:16px">
      <button id="loginBtn" style="flex:1">Login</button>
    </div>
    <div class="err" id="loginErr"></div>
    <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
      <label>Servers list (URL / IP)</label>
      <div class="servers-edit row" style="margin-top:6px">
        <input id="newServer" placeholder="https://… or 74.220.52.10:3000"/>
        <button class="ghost sm" id="addServerBtn">Add</button>
      </div>
      <div id="serverChips" class="muted" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<div id="app">
  <div class="maincol" style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="top">
      <span class="brand">AAP Admin</span>
      <select id="activeServer"></select>
      <span class="muted" id="who"></span>
      <button class="ghost sm" id="logoutBtn">Logout</button>
    </div>
    <div class="nav" id="nav">
      <button class="active" data-tab="overview">Overview</button>
      <button data-tab="users">Users</button>
      <button data-tab="payments">Payments</button>
      <button data-tab="plans">Plans</button>
      <button data-tab="health">Health</button>
      <button data-tab="servers">Servers</button>
    </div>
    <main id="content"></main>
  </div>
</div>

<script>
const STORE_KEY = 'aap_admin_servers';
const TOKEN_KEY = 'aap_admin_tokens'; // { serverUrl: token }
const DEFAULT_SERVERS = [
  'https://ai-agent-pro-api.onrender.com',
  'https://ai-agent-pro-api-nz4k.onrender.com',
];

function loadServers() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    if (Array.isArray(s) && s.length) return s;
  } catch {}
  return [...DEFAULT_SERVERS];
}
function saveServers(list) {
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
}
function loadTokens() {
  try { return JSON.parse(localStorage.getItem(TOKEN_KEY) || '{}'); } catch { return {}; }
}
function saveTokens(t) { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }

function normalizeUrl(u) {
  let s = String(u || '').trim().replace(/\/$/, '');
  if (!s) return '';
  if (/^(\d{1,3}\.){3}\d{1,3}(:\d+)?$/.test(s)) s = 'http://' + s;
  if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
  try { return new URL(s).origin; } catch { return ''; }
}

let servers = loadServers();
let tokens = loadTokens();
let active = servers[0] || '';
let me = null;
let tab = 'overview';

const $ = (id) => document.getElementById(id);

function fillServerSelects() {
  const opts = servers.map(s => `<option value="${s}">${s.replace(/^https?:\/\//,'')}</option>`).join('');
  $('loginServer').innerHTML = opts || '<option value="">— add server —</option>';
  $('activeServer').innerHTML = opts;
  if (active) {
    $('loginServer').value = active;
    $('activeServer').value = active;
  }
  $('serverChips').textContent = servers.length ? servers.join(' · ') : 'No servers';
}

async function api(path, opts = {}) {
  const base = (opts.base || active || '').replace(/\/$/, '');
  if (!base) throw new Error('No server selected');
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const tok = tokens[base];
  if (tok) headers['Authorization'] = 'Bearer ' + tok;
  const r = await fetch(base + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const t = await r.text();
  let data;
  try { data = t ? JSON.parse(t) : null; } catch { throw new Error(t || r.statusText); }
  if (!r.ok) {
    const msg = data?.error?.message || data?.error || t || ('HTTP ' + r.status);
    throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
  }
  return data?.ok ? data.data : data;
}

function showApp() {
  $('login').classList.add('hidden');
  $('app').classList.add('open');
  $('app').style.display = 'flex';
  $('who').textContent = me ? (me.email + ' · ' + me.role) : '';
  fillServerSelects();
  render();
}
function showLogin() {
  $('app').classList.remove('open');
  $('app').style.display = 'none';
  $('login').classList.remove('hidden');
  fillServerSelects();
}

async function doLogin() {
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  try {
    active = $('loginServer').value || servers[0];
    if (!active) throw new Error('Pehle server add karo');
    const d = await api('/api/v1/auth/login', {
      base: active,
      method: 'POST',
      body: { email: $('email').value.trim(), password: $('password').value },
    });
    if (d.user?.role !== 'admin') throw new Error('Admin role required');
    tokens[active] = d.token;
    saveTokens(tokens);
    me = d.user;
    showApp();
  } catch (e) {
    const msg = e.message || String(e);
    $('loginErr').textContent = /fetch|network|Failed/i.test(msg)
      ? 'Network / CORS / cold start — 30s baad retry'
      : msg;
  } finally {
    $('loginBtn').disabled = false;
  }
}

function logout() {
  if (active && tokens[active]) {
    delete tokens[active];
    saveTokens(tokens);
  }
  me = null;
  showLogin();
}

$('addServerBtn').onclick = () => {
  const u = normalizeUrl($('newServer').value);
  if (!u) return;
  if (!servers.includes(u)) servers.push(u);
  saveServers(servers);
  active = u;
  $('newServer').value = '';
  fillServerSelects();
};

$('loginBtn').onclick = doLogin;
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('logoutBtn').onclick = logout;
$('activeServer').onchange = async () => {
  active = $('activeServer').value;
  me = null;
  try {
    if (tokens[active]) {
      const d = await api('/api/v1/auth/me');
      me = d.user;
      if (me?.role !== 'admin') throw new Error('not admin');
      $('who').textContent = me.email + ' · ' + me.role;
      render();
    } else {
      showLogin();
      $('loginServer').value = active;
    }
  } catch {
    showLogin();
    $('loginServer').value = active;
  }
};

document.querySelectorAll('#nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#nav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    tab = b.dataset.tab;
    render();
  };
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function render() {
  const el = $('content');
  el.innerHTML = '<div class="muted">Loading…</div>';
  try {
    if (tab === 'overview') {
      const o = await api('/api/v1/admin/overview');
      el.innerHTML = `<div class="card"><h3>Overview · ${esc(active.replace(/^https?:\/\//,''))}</h3>
        <div class="grid">
          <div class="stat"><div class="n">${o.users ?? '—'}</div><div class="l">Users</div></div>
          <div class="stat"><div class="n">${o.auth?.admins ?? '—'}</div><div class="l">Admins</div></div>
          <div class="stat"><div class="n">${o.paymentsPending ?? 0}</div><div class="l">Payments pending</div></div>
          <div class="stat"><div class="n">${o.firebase?.ok ? 'OK' : '—'}</div><div class="l">Firebase</div></div>
        </div>
        <p class="muted" style="margin-top:12px">Storage: ${esc(o.auth?.storage || '')} · Mail: ${o.mail?.configured ? 'yes' : 'no'}</p>
      </div>`;
    } else if (tab === 'users') {
      const d = await api('/api/v1/admin/users');
      const rows = (d.users || []).map(u => `<tr>
        <td>${esc(u.email)}<div class="muted">${esc(u.name||'')}</div></td>
        <td><span class="pill">${esc(u.role)}</span></td>
        <td>${esc(u.plan)}</td>
        <td class="row">
          <button class="ghost sm" onclick="setPlan('${esc(u.id)}','monthly')">monthly</button>
          <button class="danger sm" onclick="banUser('${esc(u.id)}',true)">ban</button>
        </td>
      </tr>`).join('');
      el.innerHTML = `<div class="card"><h3>Users</h3>
        <table><thead><tr><th>User</th><th>Role</th><th>Plan</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="muted">No users</td></tr>'}</tbody></table></div>`;
    } else if (tab === 'payments') {
      const d = await api('/api/v1/admin/payments');
      const rows = (d.payments || []).map(p => `<tr>
        <td>${esc(p.email)}<div class="muted">${esc(p.plan)} · ${esc(p.txnRef||'')}</div></td>
        <td>${esc(p.status)}</td>
        <td class="row">
          ${p.status==='pending' ? `<button class="sm" onclick="reviewPay('${esc(p.id)}','approve')">Approve</button>
          <button class="danger sm" onclick="reviewPay('${esc(p.id)}','reject')">Reject</button>` : ''}
        </td>
      </tr>`).join('');
      el.innerHTML = `<div class="card"><h3>Payments</h3>
        <table><thead><tr><th>Payment</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="3" class="muted">None</td></tr>'}</tbody></table></div>`;
    } else if (tab === 'plans') {
      const d = await api('/api/v1/admin/plans');
      const rows = (d.plans || []).map(p => `<tr>
        <td>${esc(p.name)} <span class="muted">${esc(p.id)}</span></td>
        <td>${esc(p.priceLabel)}</td>
        <td>${p.storageMb} MB</td>
      </tr>`).join('');
      el.innerHTML = `<div class="card"><h3>Plans</h3>
        <table><thead><tr><th>Plan</th><th>Price</th><th>Storage</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    } else if (tab === 'health') {
      const h = await api('/api/v1/admin/health');
      let root = {};
      try { root = await fetch(active + '/api/health').then(r => r.json()); } catch {}
      el.innerHTML = `<div class="card"><h3>Health</h3>
        <p><span class="pill ${root.firebase?.ok?'ok':'bad'}">Firebase ${root.firebase?.ok?'OK':'FAIL'}</span>
        <span class="pill ${root.smtp?'ok':'bad'}">SMTP ${root.smtp?'ON':'OFF'}</span></p>
        <p class="muted">Uptime ${h.uptimeSec}s · RAM ${h.memoryMb} MB · ${esc(h.node||'')}</p>
        <pre class="muted" style="white-space:pre-wrap;font-size:.72rem">${esc(JSON.stringify(root,null,2))}</pre>
      </div>`;
    } else if (tab === 'servers') {
      el.innerHTML = `<div class="card"><h3>Attached servers</h3>
        <div class="servers-edit row">
          <input id="srvAdd" placeholder="https:// or IP:port"/>
          <button class="ghost sm" id="srvAddBtn">Add</button>
        </div>
        <div id="srvList" style="margin-top:12px"></div>
      </div>`;
      const list = $('srvList');
      list.innerHTML = servers.map(s => `<div class="row" style="margin:8px 0;justify-content:space-between">
        <span class="muted" style="word-break:break-all;flex:1">${esc(s)}</span>
        <button class="danger sm" data-rm="${esc(s)}">Remove</button>
      </div>`).join('') || '<div class="muted">Empty</div>';
      $('srvAddBtn').onclick = () => {
        const u = normalizeUrl($('srvAdd').value);
        if (!u) return;
        if (!servers.includes(u)) servers.push(u);
        saveServers(servers);
        fillServerSelects();
        render();
      };
      list.querySelectorAll('[data-rm]').forEach(btn => {
        btn.onclick = () => {
          servers = servers.filter(x => x !== btn.getAttribute('data-rm'));
          saveServers(servers);
          if (active && !servers.includes(active)) active = servers[0] || '';
          fillServerSelects();
          render();
        };
      });
    }
  } catch (e) {
    el.innerHTML = `<div class="card err">${esc(e.message)}</div>`;
    if (/unauth|token|Admin/i.test(e.message)) {
      /* stay */
    }
  }
}

window.setPlan = async (id, plan) => {
  try {
    await api('/api/v1/admin/users/' + id + '/plan', { method: 'POST', body: { plan } });
    render();
  } catch (e) { alert(e.message); }
};
window.banUser = async (id, banned) => {
  try {
    await api('/api/v1/admin/users/' + id + '/ban', { method: 'POST', body: { banned } });
    render();
  } catch (e) { alert(e.message); }
};
window.reviewPay = async (id, action) => {
  try {
    await api('/api/v1/admin/payments/' + id + '/' + (action === 'approve' ? 'approve' : 'reject'), { method: 'POST', body: {} });
    render();
  } catch (e) { alert(e.message); }
};

fillServerSelects();
// auto-session
(async () => {
  if (active && tokens[active]) {
    try {
      const d = await api('/api/v1/auth/me');
      if (d.user?.role === 'admin') { me = d.user; showApp(); return; }
    } catch {}
  }
  showLogin();
})();
</script>
</body>
</html>
