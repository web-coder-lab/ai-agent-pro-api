<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>AAP Load Balancer</title>
<style>
  :root { --bg:#07070a; --card:#12121a; --line:#27272f; --txt:#f4f4f5; --mut:#a1a1aa; --ok:#34d399; --bad:#f87171; --acc:#a78bfa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 56px; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:.9rem; margin-bottom:18px; line-height:1.45; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:.75rem; color:var(--mut); margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:#0a0a10; color:var(--txt); font-size:15px; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { border:0; border-radius:12px; padding:11px 14px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff; font-size:.9rem; }
  button.ghost { background:#1f1f28; color:var(--txt); }
  button.danger { background:#450a0a; color:#fecaca; }
  button.sm { padding:6px 10px; font-size:.75rem; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:600; }
  .pill.up { background:#052e16; color:var(--ok); }
  .pill.down { background:#450a0a; color:var(--bad); }
  .pill.unk { background:#1f1f28; color:var(--mut); }
  .item { padding:12px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .url { font-size:.85rem; word-break:break-all; }
  .meta { font-size:.72rem; color:var(--mut); margin-top:4px; }
  .err { color:var(--bad); font-size:.85rem; margin-top:8px; }
  .okmsg { color:var(--ok); font-size:.85rem; margin-top:8px; }
  code { background:#1f1f28; padding:1px 6px; border-radius:6px; font-size:.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AAP Load Balancer</h1>
  <div class="sub">URL <b>ya IP:port</b> add/edit karo · health auto · round-robin<br/>
    CIDR notes: <code>74.220.52.0/24</code> · <code>74.220.60.0/24</code> (code + husdainshah2)</div>

  <div class="card">
    <label>Backend (https://… ya 74.220.52.10:3000)</label>
    <input id="url" placeholder="https://api… or 74.220.52.10:3000" />
    <div class="row">
      <button id="addBtn">Add</button>
      <button class="ghost" id="refreshBtn">Refresh health</button>
    </div>
    <div class="err" id="err"></div>
    <div class="okmsg" id="ok"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <strong>Backends</strong>
      <span class="meta" id="ts"></span>
    </div>
    <div id="list"><div class="meta">Loading…</div></div>
  </div>

  <div class="card">
    <strong>Network notes</strong>
    <div class="meta" id="cidrs" style="margin-top:8px;line-height:1.6;"></div>
    <div class="meta" id="myip" style="margin-top:6px;"></div>
  </div>

  <div class="card">
    <strong>Dost ke PC / VPS pe</strong>
    <p class="meta" style="margin:8px 0 0;line-height:1.55;">
      <code>cd load-balancer && node server.js</code><br/>
      Open <code>http://IP:8080</code> · Apps base URL yahi LB rakho
    </p>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
async function api(path, opts={}) {
  const r = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function render(data) {
  const list = data.backends || [];
  $('ts').textContent = data.time ? new Date(data.time).toLocaleTimeString() : '';
  $('cidrs').innerHTML = (data.allowedCidrs || []).map(c => `<code>${c}</code>`).join(' · ') || '—';
  $('myip').textContent = data.clientIp ? ('Your IP: ' + data.clientIp + (data.clientIpInAllowList ? ' · in allow-list' : '')) : '';
  if (!list.length) { $('list').innerHTML = '<div class="meta">Koi server nahi</div>'; return; }
  $('list').innerHTML = list.map(b => {
    const st = b.ok === true ? 'up' : b.ok === false ? 'down' : 'unk';
    const label = st === 'up' ? 'UP' : st === 'down' ? 'DOWN' : '…';
    const safe = b.url.replace(/'/g, "\\'");
    return `<div class="item">
      <div class="url">${b.url}</div>
      <div class="meta">${b.ms != null ? b.ms + ' ms' : ''} ${b.last ? '· ' + new Date(b.last).toLocaleTimeString() : ''} ${b.error ? '· ' + b.error : ''}</div>
      <div class="row" style="margin-top:8px">
        <span class="pill ${st}">${label}</span>
        <button class="ghost sm" onclick="editUrl('${safe}')">Edit</button>
        <button class="danger sm" onclick="removeUrl('${safe}')">Remove</button>
      </div>
    </div>`;
  }).join('');
}
async function refresh() {
  try {
    $('err').textContent = '';
    const d = await api('/lb/status');
    render(d);
  } catch (e) { $('err').textContent = e.message; }
}
async function removeUrl(url) {
  await api('/lb/backends', { method: 'DELETE', body: { url } });
  refresh();
}
async function editUrl(from) {
  const to = prompt('New URL or IP:port', from);
  if (!to || to === from) return;
  try {
    await api('/lb/backends', { method: 'PUT', body: { from, to } });
    $('ok').textContent = 'Updated';
    setTimeout(() => $('ok').textContent = '', 2000);
    refresh();
  } catch (e) { $('err').textContent = e.message; }
}
$('addBtn').onclick = async () => {
  try {
    $('err').textContent = '';
    $('ok').textContent = '';
    const url = $('url').value.trim();
    if (!url) return;
    const r = await api('/lb/backends', { method: 'POST', body: { url } });
    $('url').value = '';
    $('ok').textContent = 'Added: ' + (r.added || url);
    await api('/lb/health-now', { method: 'POST' });
    refresh();
  } catch (e) { $('err').textContent = e.message; }
};
$('refreshBtn').onclick = async () => {
  await api('/lb/health-now', { method: 'POST' });
  refresh();
};
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
